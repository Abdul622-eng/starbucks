services:

  starbucks-app:
    image: ${IMAGE_NAME:-starbucks-app}:${IMAGE_TAG:-latest}

    build:
      context: .
      dockerfile: Dockerfile

    container_name: starbucks-app

    ports:
      - "8081:80"

    restart: unless-stopped

    volumes:
      - app_data:/var/cache/nginx

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app_data:
